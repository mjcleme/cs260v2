<head>
  <!-- external file reference -->
  <script src="index.js"></script>

  <!-- internal script block -->
  <script>
    function print(text) {
      document.querySelector('#message').innerText = text;
    }

    function sayGoodbye() {
      print('Goodbye');
    }
  </script>
</head>
<body>
  <button onclick="sayHello(print)">Say Hello</button>
  <button onclick="sayGoodbye()">Say Goodbye</button>

  <!-- inline attribute handler -->
  <script>
    let i = 1;
  </script>
  <button onclick="print(`i = ${i++}`)">counter</button>
  <div id="message"></div>
</body>
